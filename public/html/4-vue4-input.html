<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>4-vue4-input</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
<div id="myapp">
    <input type="text" v-model="currentInput"/>
    CurrentInput: {{ currentInput }}
</div>

<script type="module">
    const { createApp } = Vue
    const vm = createApp({
        data() {
            return {
                currentInput : null
            };
        }
    }).mount('#myapp')

</script>
</body>
</html>
