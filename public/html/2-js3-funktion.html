<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2-js3-funktion</title>
</head>
<body>
    <input type="text" id="erstzahler" placeholder="Erstzahler">
    <span> + </span>
    <input type="text" id="zweitzahler" placeholder="Zweitzahler">
    <span> = </span>
    <span id="ergebnis">ergebnis</span>
    <br><br>
    <button type="button" id="addButton">Zahlen addieren</button>

<script>
    'use strict';

    let addButton = document.getElementById('addButton');
    let ergebnis = document.getElementById('ergebnis');

    function addieren(a, b) {
        return a + b;
    }

    addButton.addEventListener('click', function () {
        let erstzahler = parseFloat(document.getElementById('erstzahler').value) || 0;
        let zweitzahler = parseFloat(document.getElementById('zweitzahler').value) || 0;

        ergebnis.innerText = addieren(erstzahler, zweitzahler);
        console.log(addieren(erstzahler, zweitzahler));
    });
</script>

</body>
</html>
