<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2-js7-operatoren</title>
</head>
<body>
<script>
    'use strict';

    let a = 1;
    let b = '1';
    let c = 2;

    console.log('a:', a);
    console.log('b:', b);
    console.log('c:', c);

    console.log('a == b:', a == b);
    console.log('a === b:', a === b);

    console.log('b < c:', b < c);

    console.log('a + b:', a + b);
    console.log('a * c:', a * c);
</script>
</body>
</html>
