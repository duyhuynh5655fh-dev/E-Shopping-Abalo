<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>4-vue5-html</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
<div id="myapp">
    <div v-html="htmlvar"></div>
</div>

<script type="module">
    const { createApp } = Vue
    const vm = createApp({
        data() {
            return {
                htmlvar : '<b>Vielen Dank</b>, für Ihren Einkauf bei <i>Abalo</i>'
            };
        }
    }).mount('#myapp')

</script>
</body>
</html>
