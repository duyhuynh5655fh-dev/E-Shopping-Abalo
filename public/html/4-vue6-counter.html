<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>4-vue6-counter</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
<div id="myapp">
    <button @click="increment">increment</button>
    Count: {{ counter }}
</div>

<script type="module">
    const { createApp } = Vue
    const vm = createApp({
        data() {
            return {
                counter : 0
            };
        },
        methods: {
            increment() {
                this.$data.counter++;
            }
        }
    }).mount('#myapp')

</script>
</body>
</html>
