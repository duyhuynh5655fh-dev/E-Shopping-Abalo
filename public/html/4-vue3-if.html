<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>4-vue3-if</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
<div id="myapp">
    <div v-if="serverdown">
        <p>Der Webserver ist zurzeit nicht erreichbar</p>
    </div>
</div>

<script type="module">
    const { createApp } = Vue
    const vm = createApp({
        data() {
            return {
                serverdown : true
            };
        }
    }).mount('#myapp')

</script>
</body>
</html>
